name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: ruff check
      - run: ruff format --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3 --check .
      - name: Gitleaks no histórico completo
        run: |
          VERSAO=8.30.1
          ARQUIVO="gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${ARQUIVO}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${ARQUIVO}" | sha256sum -c -
          tar -xzf "$ARQUIVO" gitleaks
          ./gitleaks git . --log-opts="--all" --redact --verbose
